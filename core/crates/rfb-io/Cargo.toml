[package]
name = "rfb-io"
description = "Transports for the RFB protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rfb-tunnel = { path = "../rfb-tunnel" }
russh = "0.65"
sha2 = "0.11"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros"] }

[dev-dependencies]
boringtun = "0.7.1"
smoltcp = { version = "0.14", default-features = false, features = [
  "std",
  "alloc",
  "medium-ip",
  "proto-ipv4",
  "socket-tcp",
  "iface-max-addr-count-4",
  "iface-max-route-count-4",
] }
tokio = { version = "1", features = ["time", "rt-multi-thread"] }

[lints.rust]
unsafe_code = "forbid"
