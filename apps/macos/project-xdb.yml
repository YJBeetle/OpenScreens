include:
  - project.yml

packages:
  OpenScreensXdb:
    path: ../apple/OpenScreensXdb

targets:
  OpenScreens:
    dependencies:
      - package: OpenScreensXdb
      - framework: ../apple/OpenScreensXdb/runtime/libxdb_client.1.dylib
        embed: true
        codeSign: true
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../apple/OpenScreensXdb/runtime
