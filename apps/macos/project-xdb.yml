include:
  - project.yml

packages:
  ScrctlGuiXdb:
    path: ../apple/ScrctlGuiXdb

targets:
  ScrctlGui:
    dependencies:
      - package: ScrctlGuiXdb
      - framework: ../apple/ScrctlGuiXdb/runtime/libxdb_client.1.dylib
        embed: true
        codeSign: true
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SCRCTL_XDB"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../apple/ScrctlGuiXdb/runtime
