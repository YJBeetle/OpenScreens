name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: core
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: core

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Test
        run: cargo test --workspace
        working-directory: core

  android:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - name: Configure release signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        working-directory: apps/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/release.jks
          umask 077
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScreens-android-release
          path: apps/android/app/build/outputs/apk/release/*.apk

  apple:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Build Apple core
        run: ./scripts/build-apple-core.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build macOS app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild -project OpenScreens.xcodeproj -scheme OpenScreens -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO OPENSCREENS_BUILD_VERSION="$(git describe --tags --always --dirty)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
      - name: Build iOS app
        working-directory: apps/ios
        run: |
          xcodegen generate
          xcodebuild -project OpenScreens.xcodeproj -target OpenScreens -configuration Debug -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" OPENSCREENS_BUILD_VERSION="$(git describe --tags --always --dirty)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
