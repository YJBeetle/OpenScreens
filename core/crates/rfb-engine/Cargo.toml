[package]
name = "rfb-engine"
description = "RFB client session engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = "1"
flate2 = "1"
rfb-codec = { path = "../rfb-codec" }
rfb-io = { path = "../rfb-io" }
rfb-openvpn = { path = "../rfb-openvpn" }
rfb-proto = { path = "../rfb-proto" }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[lints.rust]
unsafe_code = "forbid"
