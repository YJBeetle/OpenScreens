name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: vendor/scrctl/core
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: vendor/scrctl/core

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Test
        run: cargo test --workspace
        working-directory: vendor/scrctl/core

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Build Apple core
        run: ./scripts/build-apple-core.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build macOS app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild -project ScrctlGui.xcodeproj -scheme ScrctlGui -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO OPENSCREENS_BUILD_VERSION="$(git describe --tags --match 'v[0-9]*' --always)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
      - name: Build iOS app
        working-directory: apps/ios
        run: |
          xcodegen generate
          git diff --exit-code -- ScrctlGui.xcodeproj
          xcodebuild -project ScrctlGui.xcodeproj -target ScrctlGui -configuration Debug -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" OPENSCREENS_BUILD_VERSION="$(git describe --tags --match 'v[0-9]*' --always)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
