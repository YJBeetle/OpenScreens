[package]
name = "rfb-openvpn"
description = "Userspace OpenVPN client transport with an in-memory smoltcp TCP/IP stack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
ctr = "0.9"
hmac = "0.12"
md-5 = "0.10"
rand = "0.10"
rustls = { version = "0.23", default-features = false, features = [
  "std",
  "ring",
  "tls12",
] }
rustls-pemfile = "2"
rustls-pki-types = "1"
sha1 = "0.10"
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = [
  "std",
  "alloc",
  "medium-ip",
  "proto-ipv4",
  "socket-tcp",
  "socket-udp",
  "socket-dns",
  "proto-dns",
  "iface-max-addr-count-4",
  "iface-max-route-count-4",
  "dns-max-result-count-4",
  "dns-max-server-count-2",
] }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = [
  "net",
  "io-util",
  "rt",
  "sync",
  "time",
  "macros",
] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = [
  "std",
] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"
