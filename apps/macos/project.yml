name: OpenScreens

options:
  bundleIdPrefix: app.openscreens
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "84GS944T65"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OpenScreensUI:
    path: ../apple/OpenScreensUI
  OpenScreensClient:
    path: ../apple/OpenScreensClient

targets:
  OpenScreens:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: OpenScreensUI
        product: OpenScreensUI
      - package: OpenScreensUI
        product: OpenScreensCanvas
      - package: OpenScreensClient
        product: OpenScreensClient
    settings:
      base:
        PRODUCT_NAME: OpenScreens
        PRODUCT_BUNDLE_IDENTIFIER: app.openscreens.macos
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: OpenScreens
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "AGPL-3.0 · OpenScreens contributors"
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  OpenScreens:
    build:
      targets:
        OpenScreens: all
    run:
      config: Debug
    archive:
      config: Release
