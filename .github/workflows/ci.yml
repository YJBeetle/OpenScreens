name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Format
        run: cargo fmt --all -- --check
        working-directory: vendor/scrctl/core
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: vendor/scrctl/core

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Test
        run: cargo test --workspace
        working-directory: vendor/scrctl/core

  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Build Apple core
        run: ./scripts/build-apple-core.sh
      - name: Install XcodeGen 2.48.0
        run: |
          # Keep the generator version in sync with the checked-in iOS project.
          tool_dir="$(mktemp -d "$RUNNER_TEMP/xcodegen.XXXXXX")"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip \
            --output "$tool_dir/xcodegen.zip"
          echo "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  $tool_dir/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$tool_dir/xcodegen.zip" -d "$tool_dir"
          echo "$tool_dir/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build macOS app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild -project ScrctlGui.xcodeproj -scheme ScrctlGui -configuration Debug -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO OPENSCREENS_BUILD_VERSION="$(git describe --tags --match 'v[0-9]*' --always)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
      - name: Build iOS app
        working-directory: apps/ios
        run: |
          xcodegen generate
          git diff --exit-code -- ScrctlGui.xcodeproj
          xcodebuild -project ScrctlGui.xcodeproj -target ScrctlGui -configuration Debug -sdk iphoneos -arch arm64 CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" OPENSCREENS_BUILD_VERSION="$(git describe --tags --match 'v[0-9]*' --always)" CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
