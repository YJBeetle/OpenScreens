name: Snapshot

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snapshot-release
  cancel-in-progress: true

jobs:
  macos:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-26
    environment: Build
    env:
      HAS_MAC_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/scrctl/core
      - name: Build Apple core
        run: ./scripts/build-apple-core.sh
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Build macOS app
        working-directory: apps/macos
        run: |
          xcodegen generate
          xcodebuild -project ScrctlGui.xcodeproj -scheme ScrctlGui \
            -configuration Release -destination 'platform=macOS' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            MARKETING_VERSION="$(git describe --tags --always --dirty)" \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" \
            OPENSCREENS_BUILD_VERSION="$(git describe --tags --always --dirty)" \
            CURRENT_PROJECT_VERSION="$(git rev-list --count HEAD)" build
      - name: Sign, notarize and package
        id: package
        working-directory: apps/macos
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_SIGNING_TEAM_ID: ${{ vars.APPLE_SIGNING_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP="$PWD/build/Release/ScrctlGui.app"
          NOTARIZED=false
          if [[ "${HAS_MAC_SIGNING:-false}" == "true" ]]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p actions "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p actions "$KEYCHAIN"
            printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" \
              -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -s -k actions "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            rm -f "$RUNNER_TEMP/signing.p12"
            SPARKLE="$APP/Contents/Frameworks/Sparkle.framework"
            if [[ -d "$SPARKLE" ]]; then
              for nested in \
                "$SPARKLE/Versions/B/XPCServices/Downloader.xpc" \
                "$SPARKLE/Versions/B/XPCServices/Installer.xpc" \
                "$SPARKLE/Versions/B/Updater.app" \
                "$SPARKLE/Versions/B/Autoupdate"; do
                codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$nested"
              done
              codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$SPARKLE"
            fi
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/ScrctlGui-notarize.zip"
            xcrun notarytool submit "$RUNNER_TEMP/ScrctlGui-notarize.zip" \
              --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_APP_PASSWORD" \
              --team-id "$APPLE_SIGNING_TEAM_ID" --wait
            xcrun stapler staple "$APP"
            xcrun stapler validate "$APP"
            spctl -a -vvv "$APP"
            NOTARIZED=true
          fi
          echo "notarized=$NOTARIZED" >> "$GITHUB_OUTPUT"
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP" "$GITHUB_WORKSPACE/ScrctlGui-snapshot-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ScrctlGui-snapshot-macos
          path: ScrctlGui-snapshot-macos.zip
          if-no-files-found: error
      - name: Generate Sparkle update feed
        if: steps.package.outputs.notarized == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.BUILD_SPARKLE_PRIVATE_KEY }}
        run: |
          python3 -B scripts/ci/update-feed.py \
            --app "$PWD/apps/macos/build/Release/ScrctlGui.app" \
            --archive "$GITHUB_WORKSPACE/ScrctlGui-snapshot-macos.zip" \
            --channel snapshot \
            --enclosure-url "https://github.com/${{ github.repository }}/releases/download/snapshot/ScrctlGui-snapshot-macos.zip" \
            --output "$GITHUB_WORKSPACE/dist-feed"
      - uses: actions/upload-artifact@v4
        if: steps.package.outputs.notarized == 'true'
        with:
          name: ScrctlGui-appcast
          path: dist-feed/appcast.xml
          if-no-files-found: ignore

  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    needs: macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ScrctlGui-snapshot-*
          merge-multiple: true
          path: dist
      - name: Publish rolling snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.event.workflow_run.head_sha || github.sha }}"
          short="${sha::7}"
          date="$(date -u +%Y-%m-%d)"
          title="Development snapshot ${short} (${date})"
          mac_note="The macOS build is unsigned until notarization credentials are configured."
          if [[ "${{ needs.macos.outputs.notarized }}" == "true" ]]; then
            mac_note="The macOS build is signed with Developer ID and notarized."
          fi
          cat > notes.md <<EOF
          Automated development snapshot from \`${sha}\` (${date}).

          - $mac_note
          - Stable and pre-release channels are unaffected by this rolling release.
          EOF
          if gh release view snapshot --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit snapshot --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file notes.md --prerelease
            gh release upload snapshot --repo "$GITHUB_REPOSITORY" dist/* --clobber
          else
            gh release create snapshot --repo "$GITHUB_REPOSITORY" dist/* \
              --title "$title" --notes-file notes.md --prerelease --latest=false
          fi
      - uses: actions/download-artifact@v4
        if: needs.macos.outputs.notarized == 'true'
        continue-on-error: true
        with:
          name: ScrctlGui-appcast
          path: feed
      - name: Publish Sparkle update feed
        if: needs.macos.outputs.notarized == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f feed/appcast.xml ]]; then
            echo "No appcast was generated; skipping the update feed."
            exit 0
          fi
          if gh release view appcast --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload appcast feed/appcast.xml --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create appcast feed/appcast.xml --repo "$GITHUB_REPOSITORY" \
              --title "Update feed" --notes "Sparkle appcast for ScrctlGui." \
              --prerelease --latest=false
          fi
