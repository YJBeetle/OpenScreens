name: OpenScreens

options:
  bundleIdPrefix: app.openscreens
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    OPENSCREENS_BUILD_VERSION: dev
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "84GS944T65"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  OpenScreensUI:
    path: ../apple/OpenScreensUI
  OpenScreensClient:
    path: ../apple/OpenScreensClient

targets:
  OpenScreens:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: OpenScreensUI
        product: OpenScreensUI
      - package: OpenScreensUI
        product: OpenScreensCanvas
      - package: OpenScreensClient
        product: OpenScreensClient
    settings:
      base:
        PRODUCT_NAME: OpenScreens
        PRODUCT_BUNDLE_IDENTIFIER: app.openscreens.ios
        CODE_SIGN_ENTITLEMENTS: OpenScreens.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  OpenScreens:
    build:
      targets:
        OpenScreens: all
    run:
      config: Debug
    archive:
      config: Release
