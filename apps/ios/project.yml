name: ScrctlGui

options:
  bundleIdPrefix: app.openscreens
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    OPENSCREENS_BUILD_VERSION: dev
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "84GS944T65"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  ScrctlGuiUI:
    path: ../apple/ScrctlGuiUI
  ScrctlGuiClient:
    path: ../apple/ScrctlGuiClient

targets:
  ScrctlGui:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: ScrctlGuiUI
        product: ScrctlGuiUI
      - package: ScrctlGuiUI
        product: ScrctlGuiCanvas
      - package: ScrctlGuiClient
        product: ScrctlGuiClient
    preBuildScripts:
      - name: Generate app version
        script: |
          /bin/bash "$SCRIPT_INPUT_FILE_1" "$SCRIPT_INPUT_FILE_0" "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - "$(SRCROOT)/Info.plist"
          - "$(SRCROOT)/../../scripts/ios-build-info.sh"
          - "$(SRCROOT)/../../.git"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/Scrctl-Info.plist"
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: ScrctlGui
        PRODUCT_BUNDLE_IDENTIFIER: org.scrctl.ios
        CODE_SIGN_ENTITLEMENTS: ScrctlGui.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: "$(DERIVED_FILE_DIR)/Scrctl-Info.plist"
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  ScrctlGui:
    build:
      targets:
        ScrctlGui: all
    run:
      config: Debug
    archive:
      config: Release
      customArchiveName: ScrctlGui
